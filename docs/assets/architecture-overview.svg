<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e4e8eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cce5ef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d9e8ff;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <rect x="0" y="0" width="800" height="60" fill="url(#headerGrad)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">
    主体间关系代数 - 三大架构总览
  </text>

  <!-- 认知隔离舱 -->
  <rect x="50" y="100" width="200" height="400" rx="10" ry="10" fill="url(#boxGrad1)" stroke="#667eea" stroke-width="2"/>
  <rect x="50" y="100" width="200" height="40" rx="10" ry="10" fill="#667eea"/>
  <text x="150" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    认知隔离舱
  </text>

  <!-- 隔离舱内容 -->
  <text x="150" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    IsolationPod
  </text>

  <!-- 六个状态 -->
  <rect x="70" y="190" width="160" height="25" rx="5" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="150" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    待命 (IDLE)
  </text>

  <rect x="70" y="220" width="160" height="25" rx="5" fill="#e8f4f8" stroke="#667eea"/>
  <text x="150" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#667eea">
    活跃 (ACTIVE)
  </text>

  <rect x="70" y="250" width="160" height="25" rx="5" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="150" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    旁观 (OBSERVER)
  </text>

  <rect x="70" y="280" width="160" height="25" rx="5" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="150" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    创造 (CREATOR)
  </text>

  <rect x="70" y="310" width="160" height="25" rx="5" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="150" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    体验 (EXPERIENCER)
  </text>

  <rect x="70" y="340" width="160" height="25" rx="5" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="150" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    梦境 (DREAMING)
  </text>

  <!-- 50通道 -->
  <rect x="70" y="380" width="160" height="100" rx="5" fill="#fff" stroke="#667eea" stroke-width="1"/>
  <text x="150" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">
    50种感知通道
  </text>
  <text x="80" y="418" font-family="Arial, sans-serif" font-size="8" fill="#666">
    基础感官: 5种
  </text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="8" fill="#666">
    身体状态: 10种
  </text>
  <text x="80" y="442" font-family="Arial, sans-serif" font-size="8" fill="#666">
    情感: 5种
  </text>
  <text x="80" y="454" font-family="Arial, sans-serif" font-size="8" fill="#666">
    抽象认知: 11种
  </text>
  <text x="80" y="466" font-family="Arial, sans-serif" font-size="8" fill="#666">
    场域: 5种
  </text>
  <text x="80" y="478" font-family="Arial, sans-serif" font-size="8" fill="#666">
    社会想象: 10种
  </text>

  <!-- 感知总线 -->
  <rect x="300" y="100" width="200" height="400" rx="10" ry="10" fill="url(#boxGrad2)" stroke="#38a169" stroke-width="2"/>
  <rect x="300" y="100" width="200" height="40" rx="10" ry="10" fill="#38a169"/>
  <text x="400" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    感知总线
  </text>

  <!-- 总线内容 -->
  <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    PerceptionBus
  </text>

  <!-- emit_sync广播 -->
  <rect x="320" y="190" width="160" height="60" rx="5" fill="#fff" stroke="#38a169"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#38a169">
    emit_sync 广播
  </text>
  <text x="400" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    同步事件传递
  </text>
  <text x="400" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    可观测性过滤
  </text>

  <!-- 事件日志 -->
  <rect x="320" y="260" width="160" height="50" rx="5" fill="#f0fff4" stroke="#38a169"/>
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#38a169">
    event_log
  </text>
  <text x="400" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    事件历史记录
  </text>

  <!-- 订阅回调 -->
  <rect x="320" y="320" width="160" height="50" rx="5" fill="#fff" stroke="#38a169"/>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#38a169">
    订阅回调
  </text>
  <text x="400" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    Hook 机制
  </text>

  <!-- 隔离舱间通信示意 -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">
    舱间通信
  </text>
  <line x1="320" y1="420" x2="480" y2="420" stroke="#38a169" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="350" y="430" width="100" height="50" rx="5" fill="#e8f8f0" stroke="#38a169"/>
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">
    PerceptionEvent
  </text>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">
    source_pod
  </text>
  <text x="400" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">
    channels[]
  </text>

  <!-- 漏斗编译 -->
  <rect x="550" y="100" width="200" height="400" rx="10" ry="10" fill="url(#boxGrad3)" stroke="#e53e3e" stroke-width="2"/>
  <rect x="550" y="100" width="200" height="40" rx="10" ry="10" fill="#e53e3e"/>
  <text x="650" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    漏斗编译
  </text>

  <!-- 漏斗前端 -->
  <text x="650" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    漏斗前端
  </text>
  <rect x="570" y="185" width="160" height="55" rx="5" fill="#fff" stroke="#3182ce"/>
  <text x="650" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#3182ce">
    LanguageSignature
  </text>
  <text x="650" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">
    Python / JS / Rust / Go
  </text>
  <text x="650" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">
    Haskell / C / 关系代数
  </text>

  <!-- 窄腰IR -->
  <text x="650" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    窄腰 IR
  </text>

  <!-- 17种节点 -->
  <polygon points="650,290 720,340 720,420 580,420 580,340" fill="#fff0f0" stroke="#e53e3e" stroke-width="2"/>
  <text x="650" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#e53e3e">
    17种 IR 节点
  </text>
  <text x="650" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">
    UNIT / VOID / WITNESS
  </text>
  <text x="650" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">
    PROJECT / INJECT / LIFT
  </text>
  <text x="650" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">
    PRODUCT / COPRODUCT / ...
  </text>
  <text x="650" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">
    CAUSE / EFFECT / ...
  </text>

  <!-- 自举编译 -->
  <rect x="570" y="435" width="160" height="45" rx="5" fill="#fff" stroke="#805ad5"/>
  <text x="650" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#805ad5">
    BootstrapCompiler
  </text>
  <text x="650" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">
    自举 · 零依赖
  </text>

  <!-- 箭头连接 -->
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#667eea"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38a169"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e53e3e"/>
    </marker>
  </defs>

  <!-- 隔离舱 -> 感知总线 -->
  <line x1="250" y1="300" x2="300" y2="300" stroke="#38a169" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="275" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#38a169">
    感知事件
  </text>

  <!-- 感知总线 -> 漏斗编译 -->
  <line x1="500" y1="300" x2="550" y2="300" stroke="#e53e3e" stroke-width="3" marker-end="url(#arrow3)"/>
  <text x="525" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e53e3e">
    语义流
  </text>

  <!-- 底部说明 -->
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    认知隔离舱 ↔ 感知总线 ↔ 漏斗编译 = 主体间关系代数三大架构
  </text>

</svg>
