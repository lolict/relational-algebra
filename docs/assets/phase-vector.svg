<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="600" height="600" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="300" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    认知相位向量雷达图
  </text>
  <text x="300" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    8维向量空间可视化
  </text>

  <!-- 中心圆 -->
  <circle cx="300" cy="320" r="180" fill="url(#centerGlow)"/>

  <!-- 网格线 - 同心八边形 -->
  <g stroke="#ddd" stroke-width="1" fill="none">
    <!-- 最外层八边形 - 1.0 -->
    <polygon points="300,140 432,200 500,320 432,440 300,500 168,440 100,320 168,200" />
    <!-- 0.75 层 -->
    <polygon points="300,185 399,230 450,320 399,410 300,455 201,410 150,320 201,230" />
    <!-- 0.5 层 -->
    <polygon points="300,230 366,260 400,320 366,380 300,410 234,380 200,320 234,260" />
    <!-- 0.25 层 -->
    <polygon points="300,275 333,290 350,320 333,350 300,365 267,350 250,320 267,290" />
  </g>

  <!-- 维度标签连线 -->
  <g stroke="#aaa" stroke-width="1" stroke-dasharray="4,4">
    <line x1="300" y1="320" x2="300" y2="140"/>
    <line x1="300" y1="320" x2="432" y2="200"/>
    <line x1="300" y1="320" x2="500" y2="320"/>
    <line x1="300" y1="320" x2="432" y2="440"/>
    <line x1="300" y1="320" x2="300" y2="500"/>
    <line x1="300" y1="320" x2="168" y2="440"/>
    <line x1="300" y1="320" x2="100" y2="320"/>
    <line x1="300" y1="320" x2="168" y2="200"/>
  </g>

  <!-- 示例数据：创造模式 -->
  <!-- 值: 创造0.9, 分析0.4, 感知0.6, 情感0.7, 社交0.3, 逻辑0.4, 记忆0.6, 反思0.5 -->
  <polygon
    points="300,143 363,242 420,320 363,398 300,365 267,368 240,320 267,242"
    fill="rgba(102,126,234,0.3)"
    stroke="#667eea"
    stroke-width="2"
    filter="url(#shadow)"
  />

  <!-- 各维度标注 -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    <!-- 创造 -->
    <text x="300" y="125" text-anchor="middle" fill="#667eea">创造</text>
    <text x="300" y="115" text-anchor="middle" fill="#888" font-size="9">CREATION</text>
    <text x="300" y="108" text-anchor="middle" fill="#aaa" font-size="8">0.9</text>

    <!-- 分析 -->
    <text x="455" y="200" text-anchor="start" fill="#667eea">分析</text>
    <text x="455" y="190" text-anchor="start" fill="#888" font-size="9">ANALYSIS</text>
    <text x="455" y="180" text-anchor="start" fill="#aaa" font-size="8">0.4</text>

    <!-- 感知 -->
    <text x="515" y="320" text-anchor="start" fill="#667eea">感知</text>
    <text x="515" y="310" text-anchor="start" fill="#888" font-size="9">PERCEPTION</text>
    <text x="515" y="300" text-anchor="start" fill="#aaa" font-size="8">0.6</text>

    <!-- 情感 -->
    <text x="455" y="450" text-anchor="start" fill="#667eea">情感</text>
    <text x="455" y="440" text-anchor="start" fill="#888" font-size="9">EMOTION</text>
    <text x="455" y="430" text-anchor="start" fill="#aaa" font-size="8">0.7</text>

    <!-- 社交 -->
    <text x="300" y="525" text-anchor="middle" fill="#667eea">社交</text>
    <text x="300" y="535" text-anchor="middle" fill="#888" font-size="9">SOCIAL</text>
    <text x="300" y="545" text-anchor="middle" fill="#aaa" font-size="8">0.3</text>

    <!-- 逻辑 -->
    <text x="145" y="450" text-anchor="end" fill="#667eea">逻辑</text>
    <text x="145" y="440" text-anchor="end" fill="#888" font-size="9">LOGIC</text>
    <text x="145" y="430" text-anchor="end" fill="#aaa" font-size="8">0.4</text>

    <!-- 记忆 -->
    <text x="85" y="320" text-anchor="end" fill="#667eea">记忆</text>
    <text x="85" y="310" text-anchor="end" fill="#888" font-size="9">MEMORY</text>
    <text x="85" y="300" text-anchor="end" fill="#aaa" font-size="8">0.6</text>

    <!-- 反思 -->
    <text x="145" y="200" text-anchor="end" fill="#667eea">反思</text>
    <text x="145" y="190" text-anchor="end" fill="#888" font-size="9">REFLECTION</text>
    <text x="145" y="180" text-anchor="end" fill="#aaa" font-size="8">0.5</text>
  </g>

  <!-- 数据点标注 -->
  <g fill="#667eea">
    <circle cx="300" cy="143" r="5"/>
    <circle cx="363" cy="242" r="5"/>
    <circle cx="420" cy="320" r="5"/>
    <circle cx="363" cy="398" r="5"/>
    <circle cx="300" cy="365" r="5"/>
    <circle cx="267" cy="368" r="5"/>
    <circle cx="240" cy="320" r="5"/>
    <circle cx="267" cy="242" r="5"/>
  </g>

  <!-- 图例 -->
  <rect x="420" y="530" width="150" height="60" rx="5" fill="#fff" stroke="#ddd"/>
  <text x="435" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">相位类型</text>
  <line x1="435" y1="562" x2="465" y2="562" stroke="#667eea" stroke-width="2"/>
  <text x="475" y="566" font-family="Arial, sans-serif" font-size="10" fill="#666">创造模式</text>
  <text x="435" y="582" font-family="Arial, sans-serif" font-size="9" fill="#888">示例相位向量</text>

  <!-- 底部说明 -->
  <text x="300" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">
    向量模长: 1.68 | 余弦相似度可用于相位比较
  </text>

</svg>
